<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aeva — AI Tutor</title>
    <meta name="description" content="Your personal AI tutor. Study smarter, remember more." />
    <meta name="theme-color" content="#08091a" />

    <!-- PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aeva" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Aeva — AI Tutor" />
    <meta property="og:description" content="Your personal AI tutor. Study smarter, remember more." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Prevent flash of white before React boots -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #08091a; min-height: 100vh; }
      #root { min-height: 100vh; }
      /* Boot splash — removed by JS once React mounts */
      #boot-splash {
        position: fixed; inset: 0; background: #08091a;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s ease;
      }
      #boot-splash.fade { opacity: 0; pointer-events: none; }

      /* Real Aeva orb — matches App.jsx AevaOrb exactly */
      .boot-orb-wrap {
        position: relative; width: 120px; height: 115px;
        display: flex; align-items: center; justify-content: center;
        filter: saturate(1.55) contrast(1.10);
      }

      /* Outer aura glow */
      .boot-aura {
        position: absolute; inset: -10px; border-radius: 50%;
        background: radial-gradient(ellipse at 44% 52%, rgba(233,163,100,0.32) 0%, rgba(233,163,100,0.10) 52%, transparent 76%);
        filter: blur(20px);
        animation: auraPulse 3.2s ease-in-out infinite;
      }
      @keyframes auraPulse {
        0%,100% { transform: scale(1); opacity: 0.85; }
        50%      { transform: scale(1.18); opacity: 1; }
      }

      /* Organic blob shell */
      .boot-shell {
        position: relative; width: 106px; height: 100px;
        border-radius: 56% 44% 40% 60% / 54% 44% 56% 46%;
        overflow: hidden;
        box-shadow: inset 0 0 30px rgba(233,163,100,0.28), inset 0 2px 10px rgba(255,255,255,0.40), 0 0 28px rgba(233,163,100,0.35);
        animation: blobMorph 16s ease-in-out infinite;
      }
      @keyframes blobMorph {
        0%,100% { border-radius: 56% 44% 40% 60% / 54% 44% 56% 46%; transform: scale(1); }
        50%      { border-radius: 52% 48% 44% 56% / 53% 46% 54% 47%; transform: scale(1.018); }
      }

      /* Base gradient — exact match to DEFAULT_ORB_GRADIENT */
      .boot-base {
        position: absolute; inset: 0;
        background: linear-gradient(122deg,#040622 0%,#090b38 7%,#141870 16%,#2D308E 27%,#4545aa 38%,#6a6ac0 48%,#9898d2 56%,#c0c6e8 63%,#dde2f6 68%,#eeeaf4 72%,#f4ede0 76%,#f0d4a0 80%,#E9A364 84%,#d08038 88%,#964e20 93%,#501808 97%,#1a0806 100%);
      }

      /* Depth vignette */
      .boot-vignette {
        position: absolute; inset: 0; border-radius: inherit;
        background: radial-gradient(ellipse at 50% 50%, transparent 46%, rgba(0,0,0,0.30) 62%, rgba(0,0,0,0.58) 76%, rgba(0,0,0,0.80) 90%, rgba(0,0,0,0.92) 100%);
      }
      .boot-vignette2 {
        position: absolute; inset: 0; border-radius: inherit;
        background: radial-gradient(ellipse at 72% 28%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.30) 30%, transparent 62%);
      }

      /* Primary inner light blob */
      .boot-light1 {
        position: absolute; width: 75%; height: 70%; top: 16%; left: -6%;
        border-radius: 60% 40% 46% 54% / 58% 62% 38% 42%;
        background: radial-gradient(ellipse at 46% 52%, rgba(255,255,255,0.95) 0%, rgba(233,163,100,0.90) 20%, rgba(233,163,100,0.60) 44%, rgba(233,163,100,0.18) 70%, transparent 100%);
        filter: blur(7px); mix-blend-mode: screen;
        animation: light1drift 10s ease-in-out infinite;
      }
      @keyframes light1drift {
        0%,100% { transform: translate(0,0) scale(1); }
        25%      { transform: translate(-7px,5px) scale(1.08); }
        50%      { transform: translate(4px,-6px) scale(0.95); }
        75%      { transform: translate(-2px,3px) scale(1.04); }
      }

      /* Secondary brighter core */
      .boot-light2 {
        position: absolute; width: 36%; height: 34%; top: 30%; left: 8%;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255,255,255,1) 0%, rgba(233,163,100,0.88) 32%, rgba(233,163,100,0.40) 66%, transparent 100%);
        filter: blur(3px); mix-blend-mode: screen;
        animation: light2drift 7s ease-in-out infinite 1.2s;
        opacity: 0.95;
      }
      @keyframes light2drift {
        0%,100% { transform: translate(0,0); opacity: 0.95; }
        50%      { transform: translate(-4px,4px); opacity: 1; }
      }

      /* Rotating shimmer */
      .boot-shimmer {
        position: absolute; inset: 0; border-radius: inherit;
        background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.14) 0%, transparent 55%);
        mix-blend-mode: overlay;
        animation: shimmerSpin 28s linear infinite;
      }
      @keyframes shimmerSpin { to { transform: rotate(360deg); } }

      /* Specular highlights */
      .boot-spec1 {
        position: absolute; width: 38%; height: 28%; top: 4%; right: 2%;
        border-radius: 50%;
        background: radial-gradient(ellipse at 44% 34%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0.18) 48%, transparent 76%);
        filter: blur(5px);
      }
      .boot-spec2 {
        position: absolute; width: 8%; height: 6%; top: 8%; right: 18%;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255,255,255,1) 0%, rgba(255,255,255,0.50) 55%, transparent 80%);
        filter: blur(1px);
      }

      /* Final inner shadow */
      .boot-inner-shadow {
        position: absolute; inset: 0; border-radius: inherit;
        box-shadow: inset 0 0 65px rgba(0,0,0,0.65);
      }
    </style>
  </head>
  <body>
    <!-- Boot splash: visible before React hydrates, especially important in PWA mode -->
    <div id="boot-splash">
      <div class="boot-orb-wrap">
        <div class="boot-aura"></div>
        <div class="boot-shell">
          <div class="boot-base"></div>
          <div class="boot-vignette"></div>
          <div class="boot-vignette2"></div>
          <div class="boot-light1"></div>
          <div class="boot-light2"></div>
          <div class="boot-shimmer"></div>
          <div class="boot-spec1"></div>
          <div class="boot-spec2"></div>
          <div class="boot-inner-shadow"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Remove splash once React takes over (fires after first paint)
      window.__removeSplash = function() {
        var el = document.getElementById('boot-splash')
        if (!el) return
        el.classList.add('fade')
        setTimeout(function() { el && el.remove() }, 400)
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
